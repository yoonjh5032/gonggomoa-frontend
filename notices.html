<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>전체 공고 - 공고모아</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/public.css">
  <style>
    .notices-page { max-width:1200px; margin:0 auto; padding:24px 20px 60px; }
    .notices-page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
    .notices-page-title { font-size:1.15rem; font-weight:800; display:flex; align-items:center; gap:8px; color:#111827; }
    .notices-total { font-size:.82rem; font-weight:700; color:#1d4ed8; background:#dbeafe; padding:3px 10px; border-radius:20px; }

    .filter-bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; align-items:center; }
    .filter-bar input, .filter-bar select {
      padding:9px 14px; border:1.5px solid #e5e7eb; border-radius:10px;
      font-size:.85rem; font-family:inherit; outline:none;
      transition:border-color .15s;
    }
    .filter-bar input:focus, .filter-bar select:focus { border-color:#3b82f6; }
    .filter-search { flex:1; min-width:200px; }
    .filter-btn {
      padding:9px 20px; border:none; border-radius:10px; font-size:.85rem; font-weight:700;
      background:#1d4ed8; color:#fff; cursor:pointer; transition:opacity .15s;
    }
    .filter-btn:hover { opacity:.9; }

    .notice-table { width:100%; border-collapse:collapse; }
    .notice-table th {
      background:#f9fafb; padding:10px 12px; text-align:left;
      font-size:.78rem; font-weight:700; color:#6b7280;
      border-bottom:2px solid #e5e7eb;
      white-space:nowrap;
    }
    .notice-table td {
      padding:12px; border-bottom:1px solid #f3f4f6;
      font-size:.85rem; color:#374151; vertical-align:middle;
    }
    .notice-table tr:hover td { background:#f8fbff; }
    .notice-table .title-cell {
      max-width:400px; font-weight:600; color:#111827;
      cursor:pointer;
    }
    .notice-table .title-cell:hover { color:#1d4ed8; }
    .notice-table .src-tag {
      font-size:.7rem; font-weight:700; padding:2px 7px; border-radius:20px; white-space:nowrap;
    }
    .notice-table .src-tag.g2b_api { background:#dbeafe; color:#1d4ed8; }
    .notice-table .src-tag.seoul_board { background:#d1fae5; color:#065f46; }
    .notice-table .src-tag.seoul_contract { background:#ffedd5; color:#9a3412; }
    .type-tag { font-size:.7rem; color:#6b7280; background:#f3f4f6; padding:2px 7px; border-radius:20px; }

    .pagination { display:flex; justify-content:center; gap:4px; margin-top:24px; flex-wrap:wrap; }
    .page-btn {
      padding:8px 14px; border:1px solid #e5e7eb; border-radius:8px;
      font-size:.82rem; font-weight:600; background:#fff; color:#374151;
      cursor:pointer; transition:all .15s;
    }
    .page-btn.active { background:#1d4ed8; color:#fff; border-color:#1d4ed8; }
    .page-btn:hover:not(.active) { border-color:#93c5fd; color:#1d4ed8; }
    .page-btn:disabled { opacity:.4; cursor:not-allowed; }

    .empty-state { text-align:center; padding:60px 20px; color:#9ca3af; }
    .empty-state i { font-size:2.5rem; display:block; margin-bottom:12px; color:#d1d5db; }
    .empty-state strong { display:block; color:#111827; font-size:1rem; margin-bottom:10px; }
    .empty-state p { margin:0; font-size:.88rem; line-height:1.7; }
    .empty-state-actions { display:flex; justify-content:center; gap:10px; margin-top:18px; flex-wrap:wrap; }
    .empty-state-btn {
      padding:9px 14px; border-radius:10px; border:1px solid #cbd5e1; background:#fff; color:#334155;
      cursor:pointer; font-size:.82rem; font-weight:700;
    }
    .empty-state-btn.primary { background:#1d4ed8; color:#fff; border-color:#1d4ed8; }

    @media (max-width:768px) {
      .notice-table { font-size:.8rem; }
      .notice-table th:nth-child(4), .notice-table td:nth-child(4),
      .notice-table th:nth-child(5), .notice-table td:nth-child(5) { display:none; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="pub-header">
  <div class="pub-header-inner">
    <a href="/" class="pub-logo" aria-label="공고모아 홈으로 이동"><img src="/assets/gonggomoa-logo.png" alt="공고모아" class="pub-logo-image" onerror="this.onerror=null;this.src='/favicon.png';this.classList.add('pub-logo-image-fallback');"></a>
    <nav class="pub-nav">
      <a href="/" class="pub-nav-link"><i class="fas fa-house"></i> 홈</a>
      <a href="#" class="pub-nav-link" onclick="sessionStorage.setItem('openCal','1');location.href='/';return false;"><i class="fas fa-calendar-days"></i> 캘린더</a>
      <a href="/notices" class="pub-nav-link nav-active"><i class="fas fa-list-ul"></i> 전체보기</a>
    </nav>
    <div class="pub-header-right">
      <div class="header-guest-group" id="header-guest-group">
        <a href="/login" class="pub-btn-login"><i class="fas fa-right-to-bracket"></i> 로그인</a>
        <a href="/login?tab=register" class="pub-btn-register"><i class="fas fa-user-plus"></i> 회원가입</a>
      </div>
      <div class="header-user-group" id="header-user-group" style="display:none">
        <div class="header-user-name"><i class="fas fa-user-circle"></i><span id="header-nickname">닉네임</span></div>
        <a href="/mypage" class="pub-btn-mypage"><i class="fas fa-id-card"></i> 마이페이지</a>
        <button class="pub-btn-logout" onclick="PublicAuth.logout()"><i class="fas fa-right-from-bracket"></i> 로그아웃</button>
      </div>
    </div>
  </div>
</header>

<div class="notices-page">
  <div class="notices-page-header">
    <h1 class="notices-page-title" id="page-title"><i class="fas fa-list-ul" style="color:#3b82f6"></i> 전체 공고</h1>
    <span class="notices-total" id="notices-total">0건</span>
  </div>

  <!-- 필터 -->
  <div class="filter-bar">
    <input type="text" class="filter-search" id="f-search" placeholder="공고명, 기관명 검색..." autocomplete="off">
    <select id="f-source">
      <option value="">전체 출처</option>
      <option value="g2b_api">나라장터</option>
      <option value="seoul_board">서울시·구청</option>
      <option value="seoul_contract">계약마당</option>
    </select>
    <select id="f-type">
      <option value="">전체 유형</option>
      <option value="공사">공사</option>
      <option value="용역">용역</option>
      <option value="물품">물품</option>
      <option value="외자">외자</option>
    </select>
    <select id="f-sort">
      <option value="recent">최신순</option>
      <option value="closing">마감임박순</option>
    </select>
    <button class="filter-btn" onclick="loadPage(1)"><i class="fas fa-search"></i> 검색</button>
    <button
      class="filter-btn"
      type="button"
      id="interest-toggle-btn"
      onclick="toggleInterestMode()"
      style="background:#fff7ed;color:#c2410c;border:1px solid #fed7aa"
    >
      관심키워드만
    </button>
  </div>

  <!-- 테이블 -->
  <div style="overflow-x:auto">
    <table class="notice-table">
      <thead>
        <tr>
          <th>출처</th>
          <th>유형</th>
          <th>공고명</th>
          <th>공고기관</th>
          <th>예산</th>
          <th>마감일</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="6" style="text-align:center;padding:40px;color:#9ca3af"><i class="fas fa-spinner fa-spin"></i> 로딩 중...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>
</div>

<footer class="pub-footer">
  <div class="pub-footer-inner">
    <div class="footer-logo"><i class="fas fa-building-columns"></i> 공고모아</div>
    <p class="footer-desc">나라장터·서울시·구청 게시판·계약마당 공고 통합 검색 서비스</p>
  </div>
</footer>

<!-- 문의하기 플로팅 버튼 -->
<button class="inquiry-float-btn" id="inquiry-float-btn" aria-label="문의하기">
  <i class="fas fa-comment-dots"></i>
  <span>문의하기</span>
</button>

<!-- 문의하기 모달 -->
<div class="inquiry-modal" id="inquiry-modal" style="display:none">
  <div class="inquiry-modal-backdrop" id="inquiry-modal-close"></div>

  <div class="inquiry-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="inquiry-modal-title">
    <div class="inquiry-modal-head">
      <div>
        <h2 id="inquiry-modal-title" class="inquiry-modal-title">
          <i class="fas fa-headset"></i> 문의하기
        </h2>
        <p class="inquiry-modal-desc">서비스 문의, 광고 문의, 오류 제보를 남겨주세요.</p>
      </div>
      <button class="inquiry-close-btn" type="button" id="inquiry-close-btn" aria-label="팝업 닫기">
        <i class="fas fa-xmark"></i>
      </button>
    </div>

    <form class="inquiry-form" id="inquiry-form">
      <div class="inquiry-form-row">
        <div class="inquiry-form-group">
          <label class="inquiry-label">문의 유형</label>
          <select class="inquiry-input" name="category">
            <option value="general">일반문의</option>
            <option value="advertisement">광고문의</option>
            <option value="bug">오류제보</option>
            <option value="etc">기타</option>
          </select>
        </div>

        <div class="inquiry-form-group">
          <label class="inquiry-label">이름</label>
          <input class="inquiry-input" type="text" name="name" placeholder="이름을 입력하세요">
        </div>
      </div>

      <div class="inquiry-form-row">
        <div class="inquiry-form-group">
          <label class="inquiry-label">이메일</label>
          <input class="inquiry-input" type="email" name="email" placeholder="example@email.com">
        </div>

        <div class="inquiry-form-group">
          <label class="inquiry-label">연락처</label>
          <input class="inquiry-input" type="text" name="phone" placeholder="010-0000-0000 (선택)">
        </div>
      </div>

      <div class="inquiry-form-group">
        <label class="inquiry-label">제목</label>
        <input class="inquiry-input" type="text" name="title" placeholder="문의 제목을 입력하세요">
      </div>

      <div class="inquiry-form-group">
        <label class="inquiry-label">문의 내용</label>
        <textarea class="inquiry-input inquiry-textarea" name="message" placeholder="문의하실 내용을 입력해주세요."></textarea>
      </div>

      <label class="inquiry-check">
        <input type="checkbox" name="agree">
        <span>개인정보 수집 및 문의 응대 목적의 이용에 동의합니다.</span>
      </label>

      <div class="inquiry-actions">
        <button type="button" class="inquiry-btn inquiry-btn-light" id="inquiry-cancel-btn">취소</button>
        <button type="submit" class="inquiry-btn inquiry-btn-primary">문의 접수</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/public-api.js"></script>
<script src="../js/pageview-tracker.js"></script>
<script src="/js/public-auth.js"></script>
<script src="/js/feedback.js"></script>
<script src="/js/inquiry-popup.js"></script>
<script>
(function(){
  'use strict';

  var currentPage = 1;
  var limit = 30;
  var params = new URLSearchParams(window.location.search);
  var interestMode = params.get('interest') === '1';
  var interestKeywords = [];

  if (params.get('q'))        document.getElementById('f-search').value = params.get('q');
  if (params.get('source'))   document.getElementById('f-source').value = params.get('source');
  if (params.get('type'))     document.getElementById('f-type').value   = params.get('type');
  if (params.get('deadline')) document.getElementById('f-sort').value   = 'closing';
  if (params.get('sortBy'))   document.getElementById('f-sort').value   = params.get('sortBy');

  if (typeof PublicAuth !== 'undefined') PublicAuth.updateHeader();

  document.getElementById('f-search').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') loadPage(1);
  });

  function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function escAttr(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function srcLabel(itemOrSource) {
    if (itemOrSource && typeof itemOrSource === 'object') {
      if (itemOrSource.source_label) {
        return String(itemOrSource.source_label).indexOf('서울시·') === 0
          ? itemOrSource.source_label
          : '서울시·' + itemOrSource.source_label;
      }
      itemOrSource = itemOrSource.source_system;
    }
    return {g2b_api:'나라장터',seoul_board:'서울시·구청',seoul_contract:'계약마당'}[itemOrSource] || itemOrSource;
  }

  function normalizeKeywords(list) {
    if (typeof list === 'string') {
      try {
        var parsed = JSON.parse(list);
        list = Array.isArray(parsed) ? parsed : String(list).split(',');
      } catch (e) {
        list = String(list).split(',');
      }
    }

    if (!Array.isArray(list)) list = [];

    return list
      .map(function(v){ return String(v || '').trim(); })
      .filter(Boolean)
      .filter(function(v, i, arr){ return arr.indexOf(v) === i; })
      .slice(0, 10);
  }

  function formatKstDate(dateStr) {
    if (!dateStr) return '-';
    var d = new Date(dateStr);
    if (isNaN(d)) return '-';

    var parts = new Intl.DateTimeFormat('ko-KR', {
      timeZone: 'Asia/Seoul',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }).formatToParts(d);

    var y = '', m = '', day = '';
    parts.forEach(function(p) {
      if (p.type === 'year') y = p.value;
      if (p.type === 'month') m = p.value;
      if (p.type === 'day') day = p.value;
    });

    return y + '-' + m + '-' + day;
  }

  function setEmpty(html) {
    document.getElementById('table-body').innerHTML =
      '<tr><td colspan="6"><div class="empty-state">' + html + '</div></td></tr>';
    document.getElementById('pagination').innerHTML = '';
    document.getElementById('notices-total').textContent = '0건';
  }

  function renderLoadError(err, options) {
    options = options || {};
    var title = options.title || '데이터를 불러오지 못했습니다';
    var retryText = options.retryText || '다시 시도';
    var body = document.getElementById('table-body');
    var message = readErrorMessage(err, '서버 연결이 원활하지 않습니다. 잠시 후 다시 시도해주세요.');

    body.innerHTML =
      '<tr><td colspan="6">' +
        '<div class="empty-state">' +
          '<i class="fas fa-triangle-exclamation" style="color:#f59e0b"></i>' +
          '<strong>' + esc(title) + '</strong>' +
          '<p>' + esc(message) + '</p>' +
          '<div class="empty-state-actions">' +
            '<button type="button" class="empty-state-btn primary" id="notice-retry-btn">' + esc(retryText) + '</button>' +
            '<button type="button" class="empty-state-btn" id="notice-reset-btn">필터 초기화</button>' +
          '</div>' +
        '</div>' +
      '</td></tr>';

    document.getElementById('pagination').innerHTML = '';
    document.getElementById('notices-total').textContent = '0건';

    var retryBtn = document.getElementById('notice-retry-btn');
    var resetBtn = document.getElementById('notice-reset-btn');

    if (retryBtn) {
      retryBtn.addEventListener('click', function() {
        loadPage(currentPage || 1);
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        document.getElementById('f-search').value = '';
        document.getElementById('f-source').value = '';
        document.getElementById('f-type').value = '';
        document.getElementById('f-sort').value = 'recent';
        interestMode = false;
        interestKeywords = [];
        params.delete('deadline');
        updateInterestUi();
        loadPage(1);
      });
    }

    if (typeof Feedback !== 'undefined' && Feedback && typeof Feedback.error === 'function') {
      Feedback.error(message, { duration: 5500 });
    }
  }

  function readErrorMessage(err, fallback) {
    if (!err) return fallback;

    if (err.code === 'timeout') {
      return '응답 시간이 오래 걸리고 있습니다. 잠시 후 다시 시도해주세요.';
    }

    if (err.code === 'network_error') {
      return '네트워크 연결이 끊겼거나 서버에 연결할 수 없습니다. 연결 상태를 확인해주세요.';
    }

    if (err.code === 'rate_limited') {
      return '조회 요청이 많아 잠시 제한되었습니다. 1분 정도 후 다시 시도해주세요.';
    }

    if (err.message) return err.message;
    return fallback;
  }

  function updateInterestUi() {
    var titleEl = document.getElementById('page-title');
    var btnEl = document.getElementById('interest-toggle-btn');

    if (titleEl) {
      titleEl.innerHTML = interestMode
        ? '<i class="fas fa-star" style="color:#f59e0b"></i> 관심 키워드 공고'
        : '<i class="fas fa-list-ul" style="color:#3b82f6"></i> 전체 공고';
    }

    if (btnEl) {
      btnEl.textContent = interestMode ? '관심키워드 해제' : '관심키워드만';
      btnEl.style.background = interestMode ? '#c2410c' : '#fff7ed';
      btnEl.style.color = interestMode ? '#fff' : '#c2410c';
      btnEl.style.border = interestMode ? '1px solid #c2410c' : '1px solid #fed7aa';
    }
  }

  function syncUrl(page) {
    var url = new URL(window.location.href);

    var q = document.getElementById('f-search').value.trim();
    var source = document.getElementById('f-source').value;
    var type = document.getElementById('f-type').value;
    var sortBy = document.getElementById('f-sort').value;

    if (q) url.searchParams.set('q', q); else url.searchParams.delete('q');
    if (source) url.searchParams.set('source', source); else url.searchParams.delete('source');
    if (type) url.searchParams.set('type', type); else url.searchParams.delete('type');
    if (sortBy && sortBy !== 'recent') url.searchParams.set('sortBy', sortBy); else url.searchParams.delete('sortBy');

    if (interestMode) url.searchParams.set('interest', '1');
    else url.searchParams.delete('interest');

    if (params.get('deadline')) url.searchParams.set('deadline', params.get('deadline'));
    else url.searchParams.delete('deadline');

    if (page > 1) url.searchParams.set('page', page);
    else url.searchParams.delete('page');

    var qs = url.searchParams.toString();
    history.replaceState({}, '', url.pathname + (qs ? '?' + qs : ''));
  }

  async function ensureInterestKeywords() {
    if (!interestMode) return [];
    if (!PublicAuth || !PublicAuth.isLoggedIn()) return [];
    if (interestKeywords.length) return interestKeywords;

    var resp = await PublicAuth.getMe();
    interestKeywords = normalizeKeywords(resp && resp.user ? resp.user.keywords : []);
    return interestKeywords;
  }

  window.toggleInterestMode = async function() {
    interestMode = !interestMode;
    if (!interestMode) interestKeywords = [];
    updateInterestUi();
    await loadPage(1);
  };

  window.loadPage = async function(page) {
    currentPage = page;
    updateInterestUi();
    syncUrl(page);

    var body = document.getElementById('table-body');
    body.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#9ca3af"><i class="fas fa-spinner fa-spin"></i> 로딩 중...</td></tr>';

    try {
      var keywordList = [];

      if (interestMode) {
        if (!PublicAuth || !PublicAuth.isLoggedIn()) {
          setEmpty('<i class="fas fa-lock"></i><strong>로그인이 필요합니다</strong><p>로그인 후 관심 키워드 공고를 볼 수 있습니다.</p>');
          return;
        }

        keywordList = await ensureInterestKeywords();

        if (!keywordList.length) {
          setEmpty('<i class="fas fa-star"></i><strong>관심 키워드가 비어 있습니다</strong><p>마이페이지에서 관심 키워드를 먼저 등록해주세요.</p>');
          return;
        }
      }

      var resp = await PublicAPI.getNotices({
        q:        document.getElementById('f-search').value.trim(),
        source:   document.getElementById('f-source').value,
        type:     document.getElementById('f-type').value,
        sortBy:   document.getElementById('f-sort').value,
        daysLeft: params.get('deadline') || '',
        keywords: keywordList,
        limit:    limit,
        page:     page
      });

      var list  = resp.data || [];
      var total = resp.total || 0;

      document.getElementById('notices-total').textContent = total.toLocaleString() + '건';

      if (!list.length) {
        var selectedSource = document.getElementById('f-source').value;
        var emptyTitle = selectedSource === 'seoul_board' ? '서울시·구청 게시판 공고가 없습니다' : '조회 결과가 없습니다';
        var emptyDesc = selectedSource === 'seoul_board'
          ? '서울시 및 자치구 게시판 조건에 맞는 공고가 없습니다. 검색어나 필터를 바꿔 다시 시도해주세요.'
          : '검색어 또는 필터 조건을 바꿔 다시 시도해주세요.';
        body.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-inbox"></i><strong>' + esc(emptyTitle) + '</strong><p>' + esc(emptyDesc) + '</p></div></td></tr>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      body.innerHTML = list.map(function(n) {
        var close = formatKstDate(n.closing_at);
        return '<tr>' +
          '<td><span class="src-tag ' + (n.source_system||'') + '">' + esc(srcLabel(n)) + '</span></td>' +
          '<td><span class="type-tag">' + esc(n.notice_type || '') + '</span></td>' +
          '<td class="title-cell js-notice-link" data-id="' + escAttr(n.id) + '" data-url="' + escAttr(n.detail_url || '') + '">' + esc(n.title) + '</td>' +
          '<td>' + esc(n.issuing_org || '') + '</td>' +
          '<td style="white-space:nowrap;font-weight:600;color:#1d4ed8">' + esc(n.budget_formatted || '') + '</td>' +
          '<td style="white-space:nowrap">' + close + '</td>' +
        '</tr>';
      }).join('');

      body.querySelectorAll('.js-notice-link').forEach(function(el) {
        el.addEventListener('click', function() {
          goDetail(el.dataset.id, el.dataset.url || '');
        });
      });

      renderPagination(total);
    } catch(e) {
      renderLoadError(e, {
        title: '공고 목록을 불러오지 못했습니다',
        retryText: '현재 페이지 다시 시도'
      });
    }
  };

  function renderPagination(total) {
    var pages = Math.ceil(total / limit);
    if (pages <= 1) {
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    var html = '';
    html += '<button class="page-btn" onclick="loadPage(' + Math.max(1,currentPage-1) + ')" ' + (currentPage<=1?'disabled':'') + '><i class="fas fa-chevron-left"></i></button>';

    var start = Math.max(1, currentPage - 3);
    var end   = Math.min(pages, start + 6);

    for (var i = start; i <= end; i++) {
      html += '<button class="page-btn ' + (i===currentPage?'active':'') + '" onclick="loadPage(' + i + ')">' + i + '</button>';
    }

    html += '<button class="page-btn" onclick="loadPage(' + Math.min(pages,currentPage+1) + ')" ' + (currentPage>=pages?'disabled':'') + '><i class="fas fa-chevron-right"></i></button>';
    document.getElementById('pagination').innerHTML = html;
  }

  window.goDetail = function(id, url) {
    if (url && url !== 'undefined' && url !== '') {
      window.open(url, '_blank');
    } else {
      window.location.href = '/notices?id=' + id;
    }
  };

  updateInterestUi();
  loadPage(1);
})();
</script>
</body>
</html>
