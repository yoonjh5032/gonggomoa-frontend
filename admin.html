<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공고모아 관리자</title>
  <link rel="stylesheet" href="/css/public.css" />
</head>
<body>
  <div id="admin-app" class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-brand">
        <a href="/" class="admin-logo-link">공고모아 관리자</a>
      </div>

      <nav class="admin-nav" id="admin-tab-nav">
        <button class="admin-nav-btn active" type="button" data-tab="dashboard">
          대시보드
        </button>
        <button class="admin-nav-btn" type="button" data-tab="users">
          회원
        </button>
        <button class="admin-nav-btn" type="button" data-tab="inquiries">
          문의
        </button>
        <button class="admin-nav-btn" type="button" data-tab="logs">
          수집로그
        </button>
      </nav>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div>
          <h1 class="admin-page-title" id="admin-page-title">대시보드</h1>
          <p class="admin-page-desc" id="admin-page-desc">
            회원, 문의, 수집 현황을 한 화면에서 확인합니다.
          </p>
        </div>

        <div class="admin-topbar-actions">
          <button type="button" class="admin-btn" id="admin-refresh-btn">새로고침</button>
          <a href="/" class="admin-btn admin-btn-secondary">서비스로 이동</a>
        </div>
      </header>

      <main class="admin-content">
        <section
          id="tab-dashboard"
          class="admin-tab-panel is-active"
          data-tab-panel="dashboard"
        ></section>

        <section
          id="tab-users"
          class="admin-tab-panel"
          data-tab-panel="users"
          hidden
        ></section>

        <section
          id="tab-inquiries"
          class="admin-tab-panel"
          data-tab-panel="inquiries"
          hidden
        ></section>

        <section
          id="tab-logs"
          class="admin-tab-panel"
          data-tab-panel="logs"
          hidden
        ></section>
      </main>
    </div>
  </div>

  <script type="module" src="/js/admin/index.js"></script>
</body>
</html>
