<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>마이페이지 - 공고모아</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/public.css">
  <style>
    .mypage { max-width:700px; margin:0 auto; padding:40px 20px 60px; }
    .mypage-header { margin-bottom:32px; }
    .mypage-title { font-size:1.3rem; font-weight:800; color:#111827; display:flex; align-items:center; gap:8px; }
    .mypage-card {
      background:#fff; border:1px solid #e5e7eb; border-radius:16px;
      padding:28px; margin-bottom:20px;
      box-shadow:0 2px 12px rgba(0,0,0,.04);
    }
    .mypage-card-title {
      font-size:.95rem; font-weight:700; color:#1d4ed8;
      margin-bottom:18px; display:flex; align-items:center; gap:6px;
    }
    .mp-form-group { margin-bottom:16px; }
    .mp-label { display:block; font-size:.82rem; font-weight:700; color:#374151; margin-bottom:5px; }
    .mp-input {
      width:100%; padding:10px 14px; border:1.5px solid #e5e7eb; border-radius:10px;
      font-size:.88rem; font-family:inherit; outline:none; transition:border-color .15s;
    }
    .mp-input:focus { border-color:#3b82f6; }
    .mp-input:disabled { background:#f9fafb; color:#9ca3af; }
    .mp-btn {
      padding:10px 24px; border:none; border-radius:10px; font-size:.88rem; font-weight:700;
      background:#1d4ed8; color:#fff; cursor:pointer; transition:opacity .15s;
    }
    .mp-btn:hover { opacity:.9; }
    .mp-btn.danger { background:#dc2626; }
    .mp-msg { font-size:.82rem; margin-top:8px; min-height:18px; }
    .mp-msg.ok { color:#059669; }
    .mp-msg.err { color:#dc2626; }

    .mp-keyword-list { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
    .mp-keyword-chip {
      display:inline-flex; align-items:center; gap:4px;
      padding:5px 12px; border-radius:20px; font-size:.8rem; font-weight:600;
      background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe;
    }
    .mp-keyword-chip button {
      background:none; border:none; color:#93c5fd; font-size:.85rem; cursor:pointer;
    }
    .mp-keyword-chip button:hover { color:#dc2626; }

    @media (max-width: 640px) {
      .mypage { padding:28px 16px 48px; }
      .mypage-card { padding:22px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="pub-header">
  <div class="pub-header-inner">
    <a href="/" class="pub-logo" aria-label="공고모아 홈으로 이동"><img src="/assets/gonggomoa-logo.png" alt="공고모아" class="pub-logo-image" onerror="this.onerror=null;this.src='/favicon.png';this.classList.add('pub-logo-image-fallback');"></a>
    <nav class="pub-nav">
      <a href="/" class="pub-nav-link"><i class="fas fa-house"></i> 홈</a>
      <a href="/notices" class="pub-nav-link"><i class="fas fa-list-ul"></i> 전체보기</a>
    </nav>
    <div class="pub-header-right">
      <div class="header-guest-group" id="header-guest-group" style="display:none">
        <a href="/login" class="pub-btn-login"><i class="fas fa-right-to-bracket"></i> 로그인</a>
      </div>
      <div class="header-user-group" id="header-user-group" style="display:none">
        <div class="header-user-name"><i class="fas fa-user-circle"></i><span id="header-nickname">닉네임</span></div>
        <button class="pub-btn-logout" onclick="PublicAuth.logout()"><i class="fas fa-right-from-bracket"></i> 로그아웃</button>
      </div>
    </div>
  </div>
</header>

<div class="mypage">
  <div class="mypage-header">
    <h1 class="mypage-title"><i class="fas fa-id-card" style="color:#3b82f6"></i> 마이페이지</h1>
  </div>

  <!-- 관심 키워드 -->
  <div class="mypage-card">
    <div class="mypage-card-title"><i class="fas fa-bell"></i> 관심 키워드</div>
    <p style="font-size:.82rem;color:#6b7280;margin-bottom:12px">
      관심 키워드를 등록하면 메인 화면과 전체보기에서 관련 공고만 빠르게 볼 수 있습니다. 최대 10개까지 등록할 수 있습니다.
    </p>

    <div class="mp-keyword-list" id="kw-list"></div>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input class="mp-input" id="kw-input" placeholder="예: 서버, 네트워크, 유지보수" style="flex:1;min-width:220px">
      <button class="mp-btn" type="button" onclick="addKeyword()">추가</button>
      <button class="mp-btn" type="button" onclick="saveKeywords()" style="background:#0f766e">저장</button>
    </div>

    <div class="mp-msg" id="kw-msg"></div>
  </div>

  <!-- 기본 정보 -->
  <div class="mypage-card">
    <div class="mypage-card-title"><i class="fas fa-user"></i> 기본 정보</div>
    <div class="mp-form-group">
      <label class="mp-label">이메일</label>
      <input class="mp-input" id="mp-email" disabled>
    </div>
    <div class="mp-form-group">
      <label class="mp-label">닉네임</label>
      <input class="mp-input" id="mp-nick" placeholder="닉네임">
    </div>
    <div class="mp-form-group">
      <label class="mp-label">회사명</label>
      <input class="mp-input" id="mp-company" placeholder="소속 회사 (선택)">
    </div>
    <div class="mp-form-group">
      <label class="mp-label">연락처</label>
      <input class="mp-input" id="mp-phone" placeholder="010-0000-0000 (선택)">
    </div>
    <button class="mp-btn" onclick="saveProfile()">저장</button>
    <div class="mp-msg" id="profile-msg"></div>
  </div>

  <!-- 비밀번호 변경 -->
  <div class="mypage-card">
    <div class="mypage-card-title"><i class="fas fa-lock"></i> 비밀번호 변경</div>
    <div class="mp-form-group">
      <label class="mp-label">현재 비밀번호</label>
      <input type="password" class="mp-input" id="mp-cur-pw" placeholder="현재 비밀번호">
    </div>
    <div class="mp-form-group">
      <label class="mp-label">새 비밀번호</label>
      <input type="password" class="mp-input" id="mp-new-pw" placeholder="6자 이상">
    </div>
    <div class="mp-form-group">
      <label class="mp-label">새 비밀번호 확인</label>
      <input type="password" class="mp-input" id="mp-new-pw2" placeholder="새 비밀번호 재입력">
    </div>
    <button class="mp-btn" onclick="changePw()">비밀번호 변경</button>
    <div class="mp-msg" id="pw-msg"></div>
  </div>
</div>

<footer class="pub-footer">
  <div class="pub-footer-inner">
    <div class="footer-logo"><i class="fas fa-building-columns"></i> 공고모아</div>
    <p class="footer-desc">나라장터·서울시·지자체 입찰공고 통합 검색 서비스</p>
  </div>
</footer>

<!-- 문의하기 플로팅 버튼 -->
<button class="inquiry-float-btn" id="inquiry-float-btn" aria-label="문의하기">
  <i class="fas fa-comment-dots"></i>
  <span>문의하기</span>
</button>

<!-- 문의하기 모달 -->
<div class="inquiry-modal" id="inquiry-modal" style="display:none">
  <div class="inquiry-modal-backdrop" id="inquiry-modal-close"></div>

  <div class="inquiry-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="inquiry-modal-title">
    <div class="inquiry-modal-head">
      <div>
        <h2 id="inquiry-modal-title" class="inquiry-modal-title">
          <i class="fas fa-headset"></i> 문의하기
        </h2>
        <p class="inquiry-modal-desc">서비스 문의, 광고 문의, 오류 제보를 남겨주세요.</p>
      </div>
      <button class="inquiry-close-btn" type="button" id="inquiry-close-btn" aria-label="팝업 닫기">
        <i class="fas fa-xmark"></i>
      </button>
    </div>

    <form class="inquiry-form" id="inquiry-form">
      <div class="inquiry-form-row">
        <div class="inquiry-form-group">
          <label class="inquiry-label">문의 유형</label>
          <select class="inquiry-input" name="category">
            <option value="general">일반문의</option>
            <option value="advertisement">광고문의</option>
            <option value="bug">오류제보</option>
            <option value="etc">기타</option>
          </select>
        </div>

        <div class="inquiry-form-group">
          <label class="inquiry-label">이름</label>
          <input class="inquiry-input" type="text" name="name" placeholder="이름을 입력하세요">
        </div>
      </div>

      <div class="inquiry-form-row">
        <div class="inquiry-form-group">
          <label class="inquiry-label">이메일</label>
          <input class="inquiry-input" type="email" name="email" placeholder="example@email.com">
        </div>

        <div class="inquiry-form-group">
          <label class="inquiry-label">연락처</label>
          <input class="inquiry-input" type="text" name="phone" placeholder="010-0000-0000 (선택)">
        </div>
      </div>

      <div class="inquiry-form-group">
        <label class="inquiry-label">제목</label>
        <input class="inquiry-input" type="text" name="title" placeholder="문의 제목을 입력하세요">
      </div>

      <div class="inquiry-form-group">
        <label class="inquiry-label">문의 내용</label>
        <textarea class="inquiry-input inquiry-textarea" name="message" placeholder="문의하실 내용을 입력해주세요."></textarea>
      </div>

      <label class="inquiry-check">
        <input type="checkbox" name="agree">
        <span>개인정보 수집 및 문의 응대 목적의 이용에 동의합니다.</span>
      </label>

      <div class="inquiry-actions">
        <button type="button" class="inquiry-btn inquiry-btn-light" id="inquiry-cancel-btn">취소</button>
        <button type="submit" class="inquiry-btn inquiry-btn-primary">문의 접수</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/public-api.js"></script>
<script src="../js/pageview-tracker.js"></script>
<script src="/js/public-auth.js"></script>
<script src="/js/feedback.js"></script>
<script src="/js/inquiry-popup.js"></script>
<script>
(function(){
  'use strict';

  if (!PublicAuth.isLoggedIn()) { window.location.href = '/login'; return; }
  PublicAuth.updateHeader();

  var keywords = [];

  function escHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function normalizeKeywords(list) {
    return (list || [])
      .map(function(v){ return String(v || '').trim(); })
      .filter(Boolean)
      .filter(function(v, i, arr){ return arr.indexOf(v) === i; })
      .slice(0, 10);
  }

  function setKeywordMsg(text, isError) {
    var el = document.getElementById('kw-msg');
    el.className = 'mp-msg ' + (isError ? 'err' : 'ok');
    el.textContent = text || '';
  }

  function renderKeywords() {
    var html = keywords.map(function(kw, i) {
      return '<span class="mp-keyword-chip">' +
        escHtml(kw) +
        ' <button type="button" onclick="removeKeyword(' + i + ')"><i class="fas fa-times"></i></button>' +
      '</span>';
    }).join('');

    document.getElementById('kw-list').innerHTML =
      html || '<span style="font-size:.82rem;color:#9ca3af">등록된 키워드가 없습니다.</span>';
  }

  async function loadProfile() {
    try {
      var resp = await PublicAuth.getMe();
      var u = resp.user || {};

      document.getElementById('mp-email').value   = u.email || '';
      document.getElementById('mp-nick').value    = u.nickname || '';
      document.getElementById('mp-company').value = u.company || '';
      document.getElementById('mp-phone').value   = u.phone || '';

      keywords = normalizeKeywords(u.keywords || []);
      renderKeywords();
    } catch (err) {
      Feedback.error('정보를 불러올 수 없습니다.');
    }
  }

  window.saveProfile = async function() {
    var msg = document.getElementById('profile-msg');
    try {
      await PublicAuth.updateMe({
        nickname: document.getElementById('mp-nick').value.trim(),
        company:  document.getElementById('mp-company').value.trim(),
        phone:    document.getElementById('mp-phone').value.trim()
      });
      msg.className = 'mp-msg ok';
      msg.textContent = '저장되었습니다.';
      PublicAuth.updateHeader();
    } catch(e) {
      msg.className = 'mp-msg err';
      msg.textContent = e.message;
    }
  };

  window.changePw = async function() {
    var msg = document.getElementById('pw-msg');
    var cur = document.getElementById('mp-cur-pw').value;
    var nw  = document.getElementById('mp-new-pw').value;
    var nw2 = document.getElementById('mp-new-pw2').value;

    if (nw !== nw2) {
      msg.className = 'mp-msg err';
      msg.textContent = '새 비밀번호가 일치하지 않습니다.';
      return;
    }

    try {
      await PublicAuth.changePassword(cur, nw);
      msg.className = 'mp-msg ok';
      msg.textContent = '비밀번호가 변경되었습니다.';
      document.getElementById('mp-cur-pw').value = '';
      document.getElementById('mp-new-pw').value = '';
      document.getElementById('mp-new-pw2').value = '';
    } catch(e) {
      msg.className = 'mp-msg err';
      msg.textContent = e.message;
    }
  };

  window.saveKeywords = async function() {
    keywords = normalizeKeywords(keywords);

    try {
      var resp = await PublicAuth.updateMe({ keywords: keywords });
      if (resp && resp.user && Array.isArray(resp.user.keywords)) {
        keywords = normalizeKeywords(resp.user.keywords);
      }
      renderKeywords();
      setKeywordMsg('관심 키워드가 저장되었습니다.', false);
    } catch(e) {
      setKeywordMsg(e.message || '관심 키워드 저장에 실패했습니다.', true);
    }
  };

  window.addKeyword = async function() {
    var input = document.getElementById('kw-input');
    var kw = String(input.value || '').trim();

    if (!kw) return;

    if (keywords.indexOf(kw) !== -1) {
      setKeywordMsg('이미 등록된 키워드입니다.', true);
      return;
    }

    if (keywords.length >= 10) {
      setKeywordMsg('관심 키워드는 최대 10개까지 등록할 수 있습니다.', true);
      return;
    }

    keywords.push(kw);
    keywords = normalizeKeywords(keywords);
    input.value = '';
    renderKeywords();
    await saveKeywords();
  };

  window.removeKeyword = async function(idx) {
    keywords.splice(idx, 1);
    keywords = normalizeKeywords(keywords);
    renderKeywords();
    await saveKeywords();
  };

  document.getElementById('kw-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      addKeyword();
    }
  });

  loadProfile();
})();
</script>
</body>
</html>
