<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>로그인 / 회원가입 - 공고모아</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/public.css">
  <style>
    .auth-page {
      min-height: calc(100vh - 60px);
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
    }
    .auth-card {
      background: #fff; border-radius: 20px;
      box-shadow: 0 8px 40px rgba(0,0,0,.08);
      width: 100%; max-width: 440px;
      overflow: hidden;
    }
    .auth-tabs {
      display: flex; border-bottom: 2px solid #f3f4f6;
    }
    .auth-tab {
      flex: 1; text-align: center; padding: 16px;
      font-size: .92rem; font-weight: 700; color: #9ca3af;
      background: none; border: none; cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all .2s;
    }
    .auth-tab.active {
      color: #1d4ed8; border-bottom-color: #1d4ed8;
      background: #f8fafc;
    }
    .auth-body { padding: 32px 28px; }
    .auth-form { display: none; }
    .auth-form.active { display: block; }

    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: .82rem; font-weight: 700;
      color: #374151; margin-bottom: 6px;
    }
    .form-input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #e5e7eb;
      border-radius: 10px; font-size: .9rem; font-family: inherit;
      transition: border-color .15s;
      outline: none;
    }
    .form-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
    .form-hint { font-size: .72rem; color: #9ca3af; margin-top: 4px; }

    .auth-btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      font-size: .95rem; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, #1e40af, #2563eb);
      cursor: pointer; transition: opacity .15s;
      margin-top: 8px;
    }
    .auth-btn:hover { opacity: .9; }
    .auth-btn:disabled { opacity: .5; cursor: not-allowed; }

    .auth-msg {
      text-align: center; margin-top: 14px;
      font-size: .82rem; color: #dc2626;
      min-height: 20px;
    }
    .auth-msg.success { color: #059669; }

    .auth-footer-text {
      text-align: center; font-size: .8rem; color: #9ca3af;
      margin-top: 18px;
    }
    .auth-footer-text a { color: #3b82f6; font-weight: 600; }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="pub-header">
  <div class="pub-header-inner">
    <a href="/" class="pub-logo"><i class="fas fa-building-columns"></i><span>공고모아</span></a>
    <nav class="pub-nav">
      <a href="/" class="pub-nav-link"><i class="fas fa-house"></i> 홈</a>
      <a href="notices.html" class="pub-nav-link"><i class="fas fa-list-ul"></i> 전체보기</a>
    </nav>
    <div class="pub-header-right">
      <div class="header-guest-group" id="header-guest-group">
        <a href="login.html" class="pub-btn-login"><i class="fas fa-right-to-bracket"></i> 로그인</a>
      </div>
      <div class="header-user-group" id="header-user-group" style="display:none">
        <div class="header-user-name"><i class="fas fa-user-circle"></i><span id="header-nickname">닉네임</span></div>
        <button class="pub-btn-logout" id="header-logout-btn" onclick="PublicAuth.logout()"><i class="fas fa-right-from-bracket"></i> 로그아웃</button>
      </div>
    </div>
  </div>
</header>

<div class="auth-page">
  <div class="auth-card">
    <!-- 탭 -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">
        <i class="fas fa-right-to-bracket"></i> 로그인
      </button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">
        <i class="fas fa-user-plus"></i> 회원가입
      </button>
    </div>

    <div class="auth-body">
      <!-- 로그인 폼 -->
      <form class="auth-form active" id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">이메일</label>
          <input type="email" class="form-input" id="login-email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호</label>
          <input type="password" class="form-input" id="login-pw" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="auth-btn" id="login-btn">로그인</button>
        <div class="auth-msg" id="login-msg"></div>
        <div class="auth-footer-text">
          계정이 없으신가요? <a href="#" onclick="switchTab('register');return false;">회원가입</a>
        </div>
      </form>

      <!-- 회원가입 폼 -->
      <form class="auth-form" id="form-register" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">이메일 <span style="color:#ef4444">*</span></label>
          <input type="email" class="form-input" id="reg-email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호 <span style="color:#ef4444">*</span></label>
          <input type="password" class="form-input" id="reg-pw" placeholder="6자 이상" minlength="6" required>
          <div class="form-hint">영문/숫자 포함 6자 이상</div>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호 확인 <span style="color:#ef4444">*</span></label>
          <input type="password" class="form-input" id="reg-pw2" placeholder="비밀번호 재입력" required>
        </div>
        <div class="form-group">
          <label class="form-label">닉네임 <span style="color:#ef4444">*</span></label>
          <input type="text" class="form-input" id="reg-nick" placeholder="2~20자" minlength="2" maxlength="20" required>
        </div>
        <div class="form-group">
          <label class="form-label">회사명 <span style="color:#9ca3af">(선택)</span></label>
          <input type="text" class="form-input" id="reg-company" placeholder="소속 회사">
        </div>
        <div class="form-group">
          <label class="form-label">연락처 <span style="color:#9ca3af">(선택)</span></label>
          <input type="tel" class="form-input" id="reg-phone" placeholder="010-0000-0000">
        </div>
        <button type="submit" class="auth-btn" id="reg-btn">회원가입</button>
        <div class="auth-msg" id="reg-msg"></div>
        <div class="auth-footer-text">
          이미 계정이 있으신가요? <a href="#" onclick="switchTab('login');return false;">로그인</a>
        </div>
      </form>
    </div>
  </div>
</div>

<footer class="pub-footer">
  <div class="pub-footer-inner">
    <div class="footer-logo"><i class="fas fa-building-columns"></i> 공고모아</div>
    <p class="footer-desc">나라장터·서울시·지자체 입찰공고 통합 검색 서비스</p>
  </div>
</footer>

<script src="../js/public-api.js"></script>
<script src="../js/public-auth.js"></script>
<script src="../js/feedback.js"></script>
<script>
(function(){
  'use strict';

  // 이미 로그인 상태면 홈으로
  if (PublicAuth.isLoggedIn()) {
    window.location.href = '/';
    return;
  }

  // URL 파라미터로 탭 자동 전환
  var params = new URLSearchParams(window.location.search);
  if (params.get('tab') === 'register') switchTab('register');

  if (typeof PublicAuth !== 'undefined') PublicAuth.updateHeader();
})();

function switchTab(tab) {
  var isLogin = tab === 'login';
  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-register').classList.toggle('active', !isLogin);
  document.getElementById('form-login').classList.toggle('active', isLogin);
  document.getElementById('form-register').classList.toggle('active', !isLogin);
}

async function handleLogin(e) {
  e.preventDefault();
  var msgEl = document.getElementById('login-msg');
  var btn   = document.getElementById('login-btn');
  msgEl.className = 'auth-msg';
  msgEl.textContent = '';
  btn.disabled = true;
  try {
    var email = document.getElementById('login-email').value.trim();
    var pw    = document.getElementById('login-pw').value;
    await PublicAuth.login(email, pw);
    msgEl.className = 'auth-msg success';
    msgEl.textContent = '로그인 성공! 홈으로 이동합니다...';
    setTimeout(function(){ window.location.href = '/'; }, 800);
  } catch(err) {
    msgEl.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
}

async function handleRegister(e) {
  e.preventDefault();
  var msgEl = document.getElementById('reg-msg');
  var btn   = document.getElementById('reg-btn');
  msgEl.className = 'auth-msg';
  msgEl.textContent = '';

  var pw  = document.getElementById('reg-pw').value;
  var pw2 = document.getElementById('reg-pw2').value;
  if (pw !== pw2) { msgEl.textContent = '비밀번호가 일치하지 않습니다.'; return; }

  btn.disabled = true;
  try {
    await PublicAuth.register({
      email:    document.getElementById('reg-email').value.trim(),
      password: pw,
      nickname: document.getElementById('reg-nick').value.trim(),
      company:  document.getElementById('reg-company').value.trim(),
      phone:    document.getElementById('reg-phone').value.trim()
    });
    msgEl.className = 'auth-msg success';
    msgEl.textContent = '가입 완료! 홈으로 이동합니다...';
    setTimeout(function(){ window.location.href = '/'; }, 800);
  } catch(err) {
    msgEl.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
